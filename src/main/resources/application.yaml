spring:
  application:
    name: litora-book-review-api

  datasource:
    url: jdbc:postgresql://localhost:5432/litora_db
    username: postgres
    password: root
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: true

server:
  port: 8080

springdoc:
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: alpha

jwt:
  secret: my-super-secret-key-for-jwt-token-generation-1234567890
  expiration: 86400000 # 24 hours in ms

